# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "PricePilot ‑ Bulk Pricing"
client_id = "930bf4a52a37456c9bd646d4e5e59a8e"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/privacy/customer-data-request"
  customer_deletion_url = "/webhooks/privacy/customer-redact"
  shop_deletion_url = "/webhooks/privacy/shop-redact"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
