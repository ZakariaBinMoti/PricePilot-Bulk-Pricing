# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "PricePilot ‑ Bulk Pricing"
client_id = "930bf4a52a37456c9bd646d4e5e59a8e"
application_url = "https://pricepilot-bulk-pricing.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "app/scopes_update" ]

  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks"
  customer_deletion_url = "/webhooks"
  shop_deletion_url = "/webhooks"

[auth]
redirect_urls = [ "https://pricepilot-bulk-pricing.onrender.com/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
